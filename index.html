<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INSTATION — 모바일 라디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --dynamic-accent: #f5b740;
    --dynamic-accent-rgb: 245, 183, 64;
    --bg-dark: #050508;
    --glass-bg: rgba(20, 20, 30, 0.4);
    --text-light: #f0ede8;
    --text-dim: #aaa7a0;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    background: var(--bg-dark);
    font-family: 'Inter', sans-serif;
    color: var(--text-light);
    overflow-x: hidden;
    height: 100vh;
    position: fixed;
    width: 100%;
    touch-action: pan-y;
  }

  /* ----- 배경 레이어 (패럴랙스 + 블러 + 노이즈) ----- */
  .bg-parallax-layer {
    position: fixed;
    top: -10%;
    left: -10%;
    width: 120%;
    height: 120%;
    background-size: cover;
    background-position: center;
    filter: blur(48px) brightness(0.35);
    transform: scale(1.05);
    transition: background-image 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    will-change: transform;
    z-index: -2;
  }

  /* 패럴랙스 움직임 (기울기 반응) */
  .parallax-move {
    transition: transform 0.1s ease-out;
  }

  /* 비닐/노이즈 오버레이 */
  .noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.12'/%3E%3C/svg%3E");
    background-repeat: repeat;
    pointer-events: none;
    z-index: -1;
    opacity: 0.3;
  }

  /* 글래스 레이어 (상단) */
  .glass-reflection {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 30%, rgba(255,255,240,0.08) 0%, rgba(0,0,0,0.2) 80%);
    backdrop-filter: blur(1px);
    pointer-events: none;
    z-index: -1;
  }

  /* 메인 컨테이너 */
  .app-container {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 탭 콘텐츠 영역 */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 80px;
    scroll-behavior: smooth;
  }

  .tab-pane {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .tab-pane.active-pane {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px);}
    to { opacity: 1; transform: translateY(0);}
  }

  /* ----- 채널 그리드 (모바일 최적화) ----- */
  .channels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 8px;
  }

  .channel-card {
    background: rgba(15, 15, 20, 0.7);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(255,255,200,0.1);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .channel-card:active {
    transform: scale(0.97);
    border-color: var(--dynamic-accent);
  }

  .channel-art {
    aspect-ratio: 1 / 1;
    width: 100%;
    object-fit: cover;
  }

  .channel-info {
    padding: 12px 10px;
  }

  .channel-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--dynamic-accent);
    text-transform: uppercase;
  }

  .channel-name {
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ----- 플레이어 탭 ----- */
  .player-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }

  .album-art-frame {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 32px;
    overflow: hidden;
    margin: 20px auto;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.2s;
  }

  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 비트 반응형 글로우 (canvas 기반) */
  .beat-glow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    pointer-events: none;
    box-shadow: 0 0 0px rgba(var(--dynamic-accent-rgb), 0);
    transition: box-shadow 0.05s ease;
  }

  .track-info {
    text-align: center;
    margin: 16px 0 8px;
  }

  .track-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .track-artist {
    font-size: 18px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .progress-area {
    width: 100%;
    margin: 24px 0 20px;
  }

  .progress-bar-container {
    background: rgba(255,255,245,0.2);
    border-radius: 6px;
    height: 4px;
    width: 100%;
    cursor: pointer;
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: var(--dynamic-accent);
    border-radius: 6px;
    transition: width 0.1s linear;
  }

  .time-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .playback-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    margin: 16px 0;
  }

  .ctrl-btn {
    background: rgba(255,255,245,0.12);
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: 0.1s;
  }

  .ctrl-btn:active {
    transform: scale(0.94);
    background: var(--dynamic-accent);
    color: black;
  }

  .ctrl-btn.play-btn {
    background: var(--dynamic-accent);
    color: black;
    width: 70px;
    height: 70px;
  }

  .channel-badge {
    font-size: 12px;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 40px;
    backdrop-filter: blur(4px);
    margin-top: 12px;
  }

  /* ----- 하단 탭 네비게이션 ----- */
  .bottom-tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(12, 12, 18, 0.85);
    backdrop-filter: blur(25px);
    border-top: 1px solid rgba(255,215,120,0.2);
    display: flex;
    justify-content: space-around;
    padding: 10px 20px calc(12px + var(--safe-bottom));
    z-index: 20;
  }

  .tab-btn {
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 40px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    transition: all 0.2s;
    cursor: pointer;
  }

  .tab-btn.active-tab {
    background: var(--dynamic-accent);
    color: #000000;
    box-shadow: 0 0 12px rgba(var(--dynamic-accent-rgb), 0.6);
  }

  /* Spotify Canvas 스타일 (움직이는 입자) */
  #canvas-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.25;
  }

  /* 스크롤바 숨김 */
  .tab-content::-webkit-scrollbar {
    display: none;
  }

  /* 로딩 */
  .loading-spinner {
    text-align: center;
    margin-top: 30px;
    color: var(--dynamic-accent);
  }
</style>
</head>
<body>

<div class="bg-parallax-layer" id="parallaxBg"></div>
<div class="noise-overlay"></div>
<div class="glass-reflection"></div>
<canvas id="canvas-animation"></canvas>

<div class="app-container">
  <!-- 탭 콘텐츠 -->
  <div class="tab-content" id="tabContent">
    <!-- 채널 탭 -->
    <div class="tab-pane" id="channelsPane">
      <div style="margin-bottom: 12px;">
        <h2 style="font-size: 28px; font-weight: 700;">채널</h2>
        <p style="color: var(--text-dim); font-size: 14px;">음악 방송을 선택하세요</p>
      </div>
      <div class="channels-grid" id="channelsGrid"></div>
    </div>

    <!-- 플레이어 탭 -->
    <div class="tab-pane" id="playerPane">
      <div class="player-container">
        <div class="album-art-frame" id="albumFrame">
          <img class="album-art" id="playerAlbumArt" src="" alt="album art">
          <div class="beat-glow" id="beatGlow"></div>
        </div>
        <div class="track-info">
          <div class="track-title" id="playerTitle">–</div>
          <div class="track-artist" id="playerArtist"></div>
          <div class="channel-badge" id="playerChannelTag">INSTATION</div>
        </div>

        <div class="progress-area">
          <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time-labels">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
          </div>
        </div>

        <div class="playback-controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="이전 채널">⏮</button>
          <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
          <button class="ctrl-btn" id="nextBtn" aria-label="다음 채널">⏭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 하단 탭바 -->
  <div class="bottom-tab-bar">
    <button class="tab-btn active-tab" data-tab="channels">📻 채널</button>
    <button class="tab-btn" data-tab="player">🎵 플레이어</button>
  </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  // ---------- 기존 채널 데이터 ----------
  const channels = [
    {id:1,   img:'ori_img1',   name:'인기가요 TOP 100',       tag:'가요',    cat:'가요'},
    {id:2,   img:'ori_img2',   name:'빌보드 POP 100',         tag:'POP',     cat:'POP'},
    {id:3,   img:'ori_img3',   name:'하루종일 신나는 음악',   tag:'음악방송',cat:'음악방송'},
    {id:4,   img:'ori_img4',   name:'하루종일 잔잔한 음악',   tag:'음악방송',cat:'음악방송'},
    {id:5,   img:'ori_img5',   name:'가슴을 후벼파는 트로트', tag:'트로트',  cat:'트로트'},
    {id:7,   img:'ori_img7',   name:'클래식과 뉴에이지',      tag:'연주',    cat:'연주'},
    {id:208, img:'ori_img18',  name:'응답하라! 추억의 가요',  tag:'추억',    cat:'가요'},
    {id:9,   img:'ori_img13',  name:'7080 Pop 컬렉션',        tag:'POP',     cat:'POP'},
    {id:10,  img:'ori_img15',  name:'봄에 어울리는 음악',     tag:'음악방송',cat:'음악방송'},
    {id:11,  img:'ori_img14',  name:'영화 OST',               tag:'OST',     cat:'OST'},
    {id:12,  img:'ori_img17',  name:'드라마 OST',             tag:'OST',     cat:'OST'},
    {id:13,  img:'ori_img19',  name:'랩, 힙합',               tag:'힙합',    cat:'힙합'},
    {id:14,  img:'ori_img16',  name:'정통 재즈',              tag:'재즈',    cat:'재즈'},
    {id:206, img:'ori_img21',  name:'여름노래',               tag:'음악방송',cat:'음악방송'},
    {id:207, img:'ori_img22',  name:'가을 감성',              tag:'음악방송',cat:'음악방송'},
    {id:209, img:'ori_img23',  name:'겨울 포근한 음악',       tag:'음악방송',cat:'음악방송'},
    {id:211, img:'ori_img119', name:'산뜻한 연주',            tag:'연주',    cat:'연주'},
    {id:212, img:'ori_img120', name:'커피와 재즈',            tag:'재즈',    cat:'재즈'},
    {id:213, img:'ori_img121', name:'편안한 독서 & 집중',     tag:'음악방송',cat:'음악방송'},
    {id:214, img:'ori_img122', name:'이지리스닝 연주',        tag:'연주',    cat:'연주'},
    {id:215, img:'ori_img123', name:'힐링 피아노',            tag:'연주',    cat:'연주'},
    {id:216, img:'ori_img124', name:'아침 이지리스닝',        tag:'연주',    cat:'연주'},
    {id:217, img:'ori_img125', name:'재즈힙합 라운지',        tag:'재즈',    cat:'재즈'},
    {id:218, img:'ori_img126', name:'보사노바 & 라틴',        tag:'연주',    cat:'연주'},
  ];

  const BASE_IMG = 'https://cdn.inlive.co.kr/inLive/image/instation/';
  const audio = document.getElementById('audioPlayer');
  let currentChannelIndex = 0;
  let activeId = channels[0].id;
  let isPlaying = false;
  let currentMetaInterval = null;

  // 헬퍼
  function getPort(id) { return 10000 + id * 10; }
  function getStreamUrl(id) { return `https://live01.inlive.co.kr/listen.html?port=${getPort(id)}`; }

  // UI 요소
  const channelsGrid = document.getElementById('channelsGrid');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist = document.getElementById('playerArtist');
  const playerChannelTag = document.getElementById('playerChannelTag');
  const playerAlbumImg = document.getElementById('playerAlbumArt');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const progressFill = document.getElementById('progressFill');
  const currentTimeSpan = document.getElementById('currentTime');
  const durationSpan = document.getElementById('durationTime');
  const progressContainer = document.getElementById('progressBarContainer');
  const bgParallax = document.getElementById('parallaxBg');

  // 동적 컬러 + 앨범아트 추출 (dominant color)
  function extractDominantColor(imageElement, callback) {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = imageElement.src;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 50;
      canvas.height = 50;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 50, 50);
      const imageData = ctx.getImageData(0, 0, 50, 50);
      let r=0,g=0,b=0, count=0;
      for(let i=0; i<imageData.data.length; i+=4){
        r += imageData.data[i];
        g += imageData.data[i+1];
        b += imageData.data[i+2];
        count++;
      }
      r = Math.floor(r/count);
      g = Math.floor(g/count);
      b = Math.floor(b/count);
      const accent = `rgb(${r}, ${g}, ${b})`;
      const accentDark = `rgb(${Math.max(0,r-40)}, ${Math.max(0,g-40)}, ${Math.max(0,b-40)})`;
      document.documentElement.style.setProperty('--dynamic-accent', accent);
      document.documentElement.style.setProperty('--dynamic-accent-rgb', `${r}, ${g}, ${b}`);
      callback(accent);
    };
    img.onerror = () => {
      document.documentElement.style.setProperty('--dynamic-accent', '#f5b740');
      document.documentElement.style.setProperty('--dynamic-accent-rgb', '245,183,64');
    };
  }

  // 앨범아트 업데이트 + 배경 + 동적 컬러
  function updateAlbumArtAndBackground(artUrl) {
    if(!artUrl) {
      playerAlbumImg.src = 'https://cdn.inlive.co.kr/inLive/image/instation/ori_img1.png';
    } else {
      playerAlbumImg.src = artUrl;
    }
    // 배경 패럴랙스 레이어에도 동일 이미지 (블러)
    if(artUrl) {
      bgParallax.style.backgroundImage = `url("${artUrl}")`;
    } else {
      bgParallax.style.backgroundImage = 'linear-gradient(135deg, #1a1a24, #0a0a0f)';
    }
    // 이미지 로드 후 색상 추출
    playerAlbumImg.onload = () => {
      extractDominantColor(playerAlbumImg, (color) => {
        // dynamic accent 적용 (탭버튼 색상등)
        document.querySelectorAll('.tab-btn').forEach(btn => {
          if(btn.classList.contains('active-tab')) btn.style.backgroundColor = color;
        });
      });
    };
    if(playerAlbumImg.complete) playerAlbumImg.onload();
  }

  // 음악 메타데이터 가져오기 (stats.html)
  async function fetchMetadata(channelId) {
    const port = getPort(channelId);
    const url = `https://live01.inlive.co.kr/stats.html?port=${port}`;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) return null;
      const html = await res.text();
      const plain = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      let title = '', artist = '';
      if(plain.includes(' - ')) {
        const parts = plain.split(' - ');
        artist = parts[0].trim();
        title = parts[1].trim();
      } else {
        title = plain.substring(0, 80);
      }
      return { title, artist };
    } catch(e) {
      return null;
    }
  }

  async function pollMetadata() {
    if(!activeId) return;
    const meta = await fetchMetadata(activeId);
    if(meta && (meta.title || meta.artist)) {
      playerTitle.innerText = meta.title || '♪ 스트리밍 중';
      playerArtist.innerText = meta.artist || '';
    } else {
      playerTitle.innerText = 'INSTATION LIVE';
      playerArtist.innerText = channels.find(c=>c.id===activeId)?.name || '';
    }
  }

  // 채널 변경 (재생)
  function playChannelById(id, channelObj = null) {
    const ch = channelObj || channels.find(c => c.id === id);
    if(!ch) return;
    activeId = ch.id;
    currentChannelIndex = channels.findIndex(c => c.id === activeId);
    const streamUrl = getStreamUrl(activeId);
    audio.src = streamUrl;
    audio.load();
    audio.play().then(() => {
      isPlaying = true;
      playPauseBtn.innerText = '⏸';
    }).catch(e => console.log);
    // UI 업데이트
    playerChannelTag.innerText = ch.tag.toUpperCase();
    const albumPlaceholder = `${BASE_IMG}${ch.img}.png`;
    updateAlbumArtAndBackground(albumPlaceholder);
    if(currentMetaInterval) clearInterval(currentMetaInterval);
    pollMetadata();
    currentMetaInterval = setInterval(pollMetadata, 10000);
    // active 탭을 player로 전환
    switchTab('player');
  }

  // 진행바 이벤트
  function updateProgress() {
    if(audio.duration && !isNaN(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      currentTimeSpan.innerText = formatTime(audio.currentTime);
      durationSpan.innerText = formatTime(audio.duration);
    }
  }

  function formatTime(seconds) {
    if(isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('loadedmetadata', updateProgress);
  progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    const percent = clickX / width;
    if(audio.duration) audio.currentTime = percent * audio.duration;
  });

  function togglePlay() {
    if(!activeId) return;
    if(audio.paused) {
      audio.play();
      isPlaying = true;
      playPauseBtn.innerText = '⏸';
    } else {
      audio.pause();
      isPlaying = false;
      playPauseBtn.innerText = '▶';
    }
  }

  function nextChannel() {
    let nextIdx = (currentChannelIndex + 1) % channels.length;
    playChannelById(channels[nextIdx].id, channels[nextIdx]);
  }
  function prevChannel() {
    let prevIdx = (currentChannelIndex - 1 + channels.length) % channels.length;
    playChannelById(channels[prevIdx].id, channels[prevIdx]);
  }

  document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
  document.getElementById('nextBtn').addEventListener('click', nextChannel);
  document.getElementById('prevBtn').addEventListener('click', prevChannel);

  // 채널 그리드 렌더링
  function renderChannels() {
    channelsGrid.innerHTML = '';
    channels.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      const imgUrl = `${BASE_IMG}${ch.img}.png`;
      card.innerHTML = `
        <img class="channel-art" src="${imgUrl}" alt="${ch.name}" loading="lazy" onerror="this.src='https://cdn.inlive.co.kr/inLive/image/instation/ori_img1.png'">
        <div class="channel-info">
          <div class="channel-tag">${ch.tag}</div>
          <div class="channel-name">${ch.name}</div>
        </div>
      `;
      card.addEventListener('click', () => playChannelById(ch.id, ch));
      channelsGrid.appendChild(card);
    });
  }

  // 탭 전환
  function switchTab(tabId) {
    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active-pane'));
    document.getElementById(`${tabId}Pane`).classList.add('active-pane');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
    document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active-tab');
    // accent 색상 재적용
    const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--dynamic-accent').trim();
    if(accent && activeBtn) activeBtn.style.backgroundColor = accent;
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const tab = btn.getAttribute('data-tab');
      switchTab(tab);
    });
  });

  // ----- Spotify Canvas 스타일 애니메이션 (subtle + beat reactive amplitude) -----
  let canvasAnim = document.getElementById('canvas-animation');
  let ctxAnim = canvasAnim.getContext('2d');
  let animationId = null;
  let audioContext = null;
  let sourceNode = null;
  let analyser = null;
  let amplitude = 0;

  function setupAudioContext() {
    if(audioContext) return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    sourceNode = audioContext.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioContext.destination);
    audioContext.resume();
  }

  function getAmplitude() {
    if(!analyser) return 0;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
    return Math.min(1, sum / (dataArray.length * 128));
  }

  function drawCanvas() {
    if(!ctxAnim) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvasAnim.width = w;
    canvasAnim.height = h;
    ctxAnim.clearRect(0, 0, w, h);
    // 비트 반응 진폭
    const beat = getAmplitude();
    amplitude = amplitude * 0.95 + beat * 0.05; // smoothing
    const intensity = Math.min(0.45, amplitude * 0.8);
    
    // 그라디언트 선 (Spotify Canvas 느낌)
    const time = Date.now() * 0.002;
    ctxAnim.globalAlpha = 0.4 + intensity * 0.3;
    for(let i=0; i<6; i++) {
      ctxAnim.beginPath();
      const offset = i * 0.8;
      const yOff = Math.sin(time + i) * 20 + intensity * 80;
      for(let x=0; x<w; x+=30) {
        const y = h/2 + Math.sin(x * 0.008 + time*1.5 + offset) * (35 + intensity * 100) + yOff * 0.5;
        if(x===0) ctxAnim.moveTo(x, y);
        else ctxAnim.lineTo(x, y);
      }
      ctxAnim.strokeStyle = `rgba(var(--dynamic-accent-rgb), ${0.2 + intensity*0.5})`;
      ctxAnim.lineWidth = 2.5;
      ctxAnim.stroke();
    }
    // 떠다니는 입자
    ctxAnim.globalAlpha = 0.5 + intensity * 0.4;
    for(let p=0; p<30; p++) {
      const px = (p * 131) % w;
      const py = (Math.sin(time*0.9 + p) * 40 + h/2) + intensity * 120;
      ctxAnim.beginPath();
      ctxAnim.arc(px, py, 2 + intensity*4, 0, Math.PI*2);
      ctxAnim.fillStyle = `rgba(var(--dynamic-accent-rgb), 0.7)`;
      ctxAnim.fill();
    }
    animationId = requestAnimationFrame(drawCanvas);
  }

  // 오디오 시작 시 컨텍스트 초기화
  audio.addEventListener('play', () => {
    if(!audioContext) setupAudioContext();
    if(audioContext && audioContext.state === 'suspended') audioContext.resume();
  });
  
  drawCanvas();

  // 비트 반응 글로우 (앨범프레임)
  function updateBeatGlow() {
    if(!analyser) return;
    const amp = getAmplitude();
    const glowIntensity = Math.min(28, amp * 40);
    const glowEl = document.getElementById('beatGlow');
    if(glowEl) {
      glowEl.style.boxShadow = `0 0 ${glowIntensity}px ${glowIntensity/2}px rgba(var(--dynamic-accent-rgb), ${0.5+amp*0.5})`;
    }
    requestAnimationFrame(updateBeatGlow);
  }
  setTimeout(() => { if(!analyser) setupAudioContext(); updateBeatGlow(); }, 1000);

  // 패럴랙스 (기울기 반응)
  let tiltX = 0, tiltY = 0;
  window.addEventListener('deviceorientation', (e) => {
    if(e.beta && e.gamma) {
      tiltX = (e.gamma / 30) * 12;
      tiltY = (e.beta / 30) * 8;
      bgParallax.style.transform = `translate(${tiltX}px, ${tiltY}px) scale(1.05)`;
    }
  });
  // 마우스 움직임 fallback
  window.addEventListener('mousemove', (e) => {
    if(window.innerWidth > 768) {
      tiltX = (e.clientX / window.innerWidth - 0.5) * 20;
      tiltY = (e.clientY / window.innerHeight - 0.5) * 12;
      bgParallax.style.transform = `translate(${tiltX}px, ${tiltY}px) scale(1.05)`;
    }
  });
  
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .catch(err => console.warn('SW 등록 실패:', err));
    });
  }
  
  // 초기 로드: 첫 채널 자동 재생 (사용자 제스처 필요하므로 대기)
  function init() {
    renderChannels();
    // 앱 첫 실행: 채널 탭 상태, 기본 앨범 아트 표시
    updateAlbumArtAndBackground(`${BASE_IMG}${channels[0].img}.png`);
    playerTitle.innerText = 'INSTATION';
    playerArtist.innerText = channels[0].name;
    playerChannelTag.innerText = channels[0].tag.toUpperCase();
    switchTab('channels');
    // 자동 재생 방지: 사용자 탭 후 재생 -> 채널 클릭
    audio.volume = 0.8;
  }
  init();

  // meta polling stop when channel change
  window.addEventListener('beforeunload', () => {
    if(currentMetaInterval) clearInterval(currentMetaInterval);
  });
</script>
</body>
</html>
