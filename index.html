<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSTATION">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>INSTATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border-bright:rgba(255,180,60,0.35);
  --gold:#f5b740;
  --gold2:#e8960a;
  --text:#e8e0d0;
  --text-muted:#7a7268;
  --text-dim:#4a4642;
  --red:#e84545;
  --mono:'Space Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --player-h:72px;
  --player-h-mobile:auto;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding:0 var(--safe-r) calc(var(--player-h) + var(--safe-b) + 20px) var(--safe-l);
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-y;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
  pointer-events:none;
  z-index:9999;
}

/* HEADER */
.header{
  padding:28px 20px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--border);
  max-width:1200px;margin:0 auto;
}
.logo-wordmark{
  font-family:var(--mono);font-size:26px;font-weight:700;
  letter-spacing:0.15em;color:var(--gold);line-height:1;
}
.logo-sub{
  font-family:var(--mono);font-size:9px;letter-spacing:0.28em;
  color:var(--text-muted);margin-top:5px;
}
.header-right{display:flex;align-items:center;gap:10px}
.signal-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.signal-bars span{
  width:4px;background:var(--gold);border-radius:1px;opacity:0.2;transition:opacity 0.3s;
}
.signal-bars span:nth-child(1){height:7px}
.signal-bars span:nth-child(2){height:12px}
.signal-bars span:nth-child(3){height:16px}
.signal-bars span:nth-child(4){height:20px}
.signal-bars.active span{animation:pulse-bar 1.4s ease-in-out infinite}
.signal-bars.active span:nth-child(1){animation-delay:0s}
.signal-bars.active span:nth-child(2){animation-delay:0.15s}
.signal-bars.active span:nth-child(3){animation-delay:0.3s}
.signal-bars.active span:nth-child(4){animation-delay:0.45s}
@keyframes pulse-bar{0%,100%{opacity:0.15}50%{opacity:1}}
.on-air{
  font-family:var(--mono);font-size:9px;letter-spacing:0.2em;
  padding:5px 9px;border:1px solid var(--red);color:var(--red);
  border-radius:3px;opacity:0;transition:opacity 0.3s;
}
.on-air.active{opacity:1;animation:blink-on-air 1.5s ease-in-out infinite}
@keyframes blink-on-air{0%,100%{opacity:1}50%{opacity:0.3}}

/* TICKER */
.ticker-wrap{
  overflow:hidden;background:var(--surface);
  border-bottom:1px solid var(--border);padding:7px 0;
}
.ticker-inner{
  display:flex;white-space:nowrap;
  animation:ticker 45s linear infinite;
}
.ticker-item{
  font-family:var(--mono);font-size:10px;
  color:var(--text-muted);letter-spacing:0.1em;padding:0 36px;
}
.ticker-item::before{content:'◆  ';color:var(--gold)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* FILTER — 가로 스크롤, 줄바꿈 없음 */
.filter-wrap{
  max-width:1200px;margin:0 auto;
  padding:16px 20px 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-wrap::-webkit-scrollbar{display:none}
.filter-section{display:flex;gap:7px;flex-wrap:nowrap;width:max-content}
.filter-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
  padding:0 14px;
  min-height:36px;
  display:flex;align-items:center;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  border-radius:2px;cursor:pointer;
  transition:all 0.2s;white-space:nowrap;
}
@media(hover:hover){.filter-btn:hover{border-color:var(--gold2);color:var(--gold)}}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* GRID */
.grid-section{max-width:1200px;margin:20px auto 0;padding:0 20px}
.section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:0.3em;
  color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;padding-left:2px;
}
.channel-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:2px;
}

/* CARD */
.ch-card{
  position:relative;background:var(--surface);
  border:1px solid var(--border);cursor:pointer;
  overflow:hidden;aspect-ratio:1/1.1;
  display:flex;flex-direction:column;
  transition:border-color 0.2s;
}
.ch-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.92) 100%);
  z-index:1;
}
@media(hover:hover){
  .ch-card:hover{border-color:var(--border-bright);z-index:2;transform:scale(1.02)}
  .ch-card:hover .ch-thumb{transform:scale(1.07)}
}
@media(hover:none){.ch-card:active{border-color:var(--border-bright);opacity:0.82}}
.ch-card.active{border-color:var(--gold)}
.ch-card.active::after{
  content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--gold);z-index:10;
}
.ch-num{
  position:absolute;top:8px;left:10px;
  font-family:var(--mono);font-size:9px;
  color:var(--gold);letter-spacing:0.1em;z-index:3;opacity:0.6;
}
.ch-thumb{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.4s ease;position:absolute;inset:0;
}
.ch-thumb-placeholder{
  position:absolute;inset:0;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.ch-info{position:absolute;bottom:0;left:0;right:0;padding:10px;z-index:3}
.ch-tag{
  font-family:var(--mono);font-size:8px;letter-spacing:0.18em;
  color:var(--gold);text-transform:uppercase;margin-bottom:3px;opacity:0.85;
}
.ch-name{font-size:12px;font-weight:500;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
.ch-playing-badge{position:absolute;top:8px;right:8px;z-index:5;display:none}
.ch-card.active .ch-playing-badge{display:flex}
.ch-playing-badge svg{width:16px;height:16px}
.eq-bar{animation:eq-anim 0.6s ease-in-out infinite alternate;transform-origin:bottom}
.eq-bar:nth-child(2){animation-delay:0.15s}
.eq-bar:nth-child(3){animation-delay:0.3s}
@keyframes eq-anim{from{transform:scaleY(0.3)}to{transform:scaleY(1)}}
.ch-card.hidden-card{display:none}

/* ========= 플레이어 바 (기본/데스크톱 = 가로 1열) ========= */
.player-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,8,12,0.98);
  border-top:1px solid var(--border-bright);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  display:none;z-index:1000;
  height:auto;                     /* 높이 자동 조절 */
  padding-bottom:var(--safe-b);
}
.player-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.5;
}
.player-bar.visible{display:block}
.player-inner{
  max-width:1200px;margin:0 auto;
  padding:10px 20px;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:14px;
}

/* 플레이어 상단/하단 그룹 (데스크톱에서는 가로 배치를 위해) */
.player-top{
  display:flex;
  align-items:center;
  gap:14px;
  flex:1;
  min-width:0;
}
.player-bottom{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}

/* 썸네일 + 정보 스타일 */
.player-thumb-wrap{
  width:46px;height:46px;border-radius:2px;
  border:1px solid var(--border-bright);overflow:hidden;
  flex-shrink:0;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.player-thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.player-info{
  flex:1;
  min-width:0;
}
.player-ch-name{
  font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
.player-ch-tag{
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.15em;color:var(--gold);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-freq{
  font-family:var(--mono);font-size:18px;font-weight:700;
  color:var(--gold);letter-spacing:0.05em;
  flex-shrink:0;min-width:82px;text-align:right;
}
.play-btn{
  width:48px;height:48px;border-radius:50%;
  border:2px solid var(--gold);background:transparent;color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background 0.15s,color 0.15s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
@media(hover:hover){.play-btn:hover{background:var(--gold);color:#000}}
.play-btn:active{background:var(--gold);color:#000}
.play-btn svg{width:18px;height:18px}

.vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:110px}
.vol-icon{
  background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;
  min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  transition:color 0.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
@media(hover:hover){.vol-icon:hover{color:var(--gold)}}
.vol-icon:active{color:var(--gold)}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;background:var(--surface2);border-radius:2px;
  outline:none;border:none;cursor:pointer;min-width:60px;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--gold);cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
}
audio{display:none}

/* ========= 모바일 전용: 2열 레이아웃, 이름/태그 윗줄, 주파수+버튼 아랫줄 ========= */
@media (max-width: 640px) {
  body {
    /* 플레이어 높이 증가에 맞춰 padding-bottom 조정 */
    padding-bottom: calc(112px + var(--safe-b) + 16px);
  }
  
  .player-bar {
    min-height: calc(104px + var(--safe-b));
  }
  
  .player-inner {
    flex-direction: column;
    align-items: stretch;
    padding: 12px 20px;
    gap: 12px;
  }
  
  /* 윗줄: 썸네일 + 이름/태그 영역을 가로로 배치, 이름 풀네임 표시 */
  .player-top {
    width: 100%;
    flex: none;
    gap: 12px;
  }
  
  .player-info {
    flex: 1;
    min-width: 0;
  }
  
  /* 이름 줄바꿈 허용, 가독성 up */
  .player-ch-name {
    white-space: normal;
    word-break: keep-all;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  
  .player-ch-tag {
    white-space: normal;
    font-size: 10px;
    letter-spacing: 0.12em;
  }
  
  /* 아랫줄: 주파수, 재생버튼, 볼륨 컨트롤을 균등하게 배치 */
  .player-bottom {
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .player-freq {
    font-size: 20px;
    min-width: auto;
    text-align: left;
    letter-spacing: 0.02em;
    flex: 1;
  }
  
  .play-btn {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }
  
  .vol-wrap {
    flex: 1.2;
    min-width: 110px;
    gap: 8px;
  }
  
  .vol-slider {
    min-width: 80px;
  }
  
  /* 썸네일 크기 살짝 키움 */
  .player-thumb-wrap {
    width: 52px;
    height: 52px;
  }
}

/* 중간 사이즈 태블릿 대응 (선택) */
@media (min-width: 641px) and (max-width: 900px) {
  .player-freq {
    font-size: 16px;
    min-width: 70px;
  }
  .vol-wrap {
    min-width: 100px;
  }
}

/* 앱으로 실행될 때(설치 후)만 적용 */
@media all and (display-mode: standalone) {
  .install-banner {
    display: none;  /* 설치 안내 배너를 숨김 */
  }
  body {
    padding-top: env(safe-area-inset-top); /* 상단 노치 영역 대비 */
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-wordmark">INSTATION</div>
    <div class="logo-sub">지금, 당신만의 음악 방송</div>
  </div>
  <div class="header-right">
    <div class="signal-bars" id="signalBars">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="on-air" id="onAir">ON AIR</div>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker-inner" id="ticker"></div>
</div>

<div class="filter-wrap">
  <div class="filter-section" id="filterSection"></div>
</div>

<section class="grid-section">
  <div class="section-label" id="gridLabel">ALL CHANNELS</div>
  <div class="channel-grid" id="channelGrid"></div>
</section>

<div class="player-bar" id="playerBar">
  <div class="player-inner">
    <!-- 윗줄: 썸네일 + 방송 정보 (이름/태그) -->
    <div class="player-top">
      <div class="player-thumb-wrap" id="playerThumbWrap">🎵</div>
      <div class="player-info">
        <div class="player-ch-name" id="playerName">–</div>
        <div class="player-ch-tag" id="playerTag">INSTATION</div>
      </div>
    </div>
    <!-- 아랫줄: 주파수, 재생버튼, 볼륨 컨트롤 -->
    <div class="player-bottom">
      <div class="player-freq" id="playerFreq">–</div>
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="재생/일시정지">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21" id="playIcon"/>
        </svg>
      </button>
      <div class="vol-wrap">
        <button class="vol-icon" onclick="toggleMute()" id="volIcon" aria-label="음소거">🔊</button>
        <input type="range" min="0" max="1" step="0.01" value="0.85"
               class="vol-slider" id="volSlider" oninput="setVolume(this.value)">
      </div>
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
/* 우클릭·드래그·선택 방지 */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const channels=[
  {id:1,   img:'ori_img1',   name:'인기가요 TOP 100',       tag:'가요',    cat:'가요'},
  {id:2,   img:'ori_img2',   name:'빌보드 POP 100',         tag:'POP',     cat:'POP'},
  {id:3,   img:'ori_img3',   name:'하루종일 신나는 음악',   tag:'음악방송',cat:'음악방송'},
  {id:4,   img:'ori_img4',   name:'하루종일 잔잔한 음악',   tag:'음악방송',cat:'음악방송'},
  {id:5,   img:'ori_img5',   name:'가슴을 후벼파는 트로트', tag:'트로트',  cat:'트로트'},
  {id:7,   img:'ori_img7',   name:'클래식과 뉴에이지',      tag:'연주',    cat:'연주'},
  {id:208, img:'ori_img18',  name:'응답하라! 추억의 가요',  tag:'추억',    cat:'가요'},
  {id:9,   img:'ori_img13',  name:'7080 Pop 컬렉션',        tag:'POP',     cat:'POP'},
  {id:10,  img:'ori_img15',  name:'봄에 어울리는 음악',     tag:'음악방송',cat:'음악방송'},
  {id:11,  img:'ori_img14',  name:'영화 OST',               tag:'OST',     cat:'OST'},
  {id:12,  img:'ori_img17',  name:'드라마 OST',             tag:'OST',     cat:'OST'},
  {id:13,  img:'ori_img19',  name:'랩, 힙합',               tag:'힙합',    cat:'힙합'},
  {id:14,  img:'ori_img16',  name:'정통 재즈',              tag:'재즈',    cat:'재즈'},
  {id:206, img:'ori_img21',  name:'여름노래',               tag:'음악방송',cat:'음악방송'},
  {id:207, img:'ori_img22',  name:'가을 감성',              tag:'음악방송',cat:'음악방송'},
  {id:209, img:'ori_img23',  name:'겨울 포근한 노래',       tag:'음악방송',cat:'음악방송'},
  {id:211, img:'ori_img119', name:'산뜻한 연주',            tag:'연주',    cat:'연주'},
  {id:212, img:'ori_img120', name:'커피와 재즈',            tag:'재즈',    cat:'재즈'},
  {id:213, img:'ori_img121', name:'편안한 독서 & 집중',     tag:'음악방송',cat:'음악방송'},
  {id:214, img:'ori_img122', name:'이지리스닝 연주',        tag:'연주',    cat:'연주'},
  {id:215, img:'ori_img123', name:'힐링 피아노',            tag:'연주',    cat:'연주'},
  {id:216, img:'ori_img124', name:'아침 이지리스닝',        tag:'연주',    cat:'연주'},
  {id:217, img:'ori_img125', name:'재즈힙합 라운지',        tag:'재즈',    cat:'재즈'},
  {id:218, img:'ori_img126', name:'보사노바 & 라틴',        tag:'연주',    cat:'연주'},
];

const BASE_IMG='https://cdn.inlive.co.kr/inLive/image/instation/';
const audio=document.getElementById('audioEl');
let activeId=null,isMuted=false;

function getPort(id){return 10000+id*10}
function fakeFreq(id){
  const idx=channels.findIndex(c=>c.id===id);
  return (87.5+(108-87.5)/channels.length*idx).toFixed(1)+' FM';
}

function buildTicker(){
  const names=channels.map(c=>c.name);
  document.getElementById('ticker').innerHTML=
    [...names,...names].map(n=>`<span class="ticker-item">${n}</span>`).join('');
}

function buildFilters(){
  const cats=['ALL',...new Set(channels.map(c=>c.cat))];
  const sec=document.getElementById('filterSection');
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'+(cat==='ALL'?' active':'');
    btn.textContent=cat;
    btn.addEventListener('click',()=>applyFilter(cat,btn));
    sec.appendChild(btn);
  });
}

function applyFilter(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.ch-card').forEach(c=>{
    c.classList.toggle('hidden-card',cat!=='ALL'&&c.dataset.cat!==cat);
  });
  document.getElementById('gridLabel').textContent=
    cat==='ALL'?'ALL CHANNELS':cat.toUpperCase()+' CHANNELS';
}

function buildGrid(){
  const grid=document.getElementById('channelGrid');
  channels.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='ch-card';
    card.dataset.id=ch.id;
    card.dataset.cat=ch.cat;
    const imgSrc=`${BASE_IMG}${ch.img}.png`;
    card.innerHTML=`
      <img class="ch-thumb" src="${imgSrc}" alt="${ch.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="ch-thumb-placeholder" style="display:none">🎵</div>
      <div class="ch-num">CH ${String(i+1).padStart(2,'0')}</div>
      <div class="ch-playing-badge">
        <svg viewBox="0 0 18 18" fill="#f5b740">
          <rect class="eq-bar" x="1" y="4" width="3" height="10" rx="1"/>
          <rect class="eq-bar" x="7" y="2" width="3" height="14" rx="1"/>
          <rect class="eq-bar" x="13" y="5" width="3" height="9" rx="1"/>
        </svg>
      </div>
      <div class="ch-info">
        <div class="ch-tag">${ch.tag}</div>
        <div class="ch-name">${ch.name}</div>
      </div>`;
    card.addEventListener('click',()=>playChannel(ch,card,imgSrc));
    grid.appendChild(card);
  });
}

function playChannel(ch,card,imgSrc){
  if(activeId===ch.id){togglePlay();return}
  activeId=ch.id;
  document.querySelectorAll('.ch-card').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  // 스트림 URL 구성 (기존 방식 유지)
  audio.src=`https://live01.inlive.co.kr/listen.html?port=${getPort(ch.id)}`;
  audio.play().catch(()=>{});
  document.getElementById('playerBar').classList.add('visible');
  document.getElementById('playerName').textContent=ch.name;
  document.getElementById('playerTag').textContent=ch.tag.toUpperCase();
  document.getElementById('playerFreq').textContent=fakeFreq(ch.id);
  const wrap=document.getElementById('playerThumbWrap');
  wrap.innerHTML='🎵';
  const img=new Image();
  img.src=imgSrc;img.alt=ch.name;
  img.onload=()=>{wrap.innerHTML='';wrap.appendChild(img)};
  setPlayIcon(true);
  document.getElementById('onAir').classList.add('active');
  document.getElementById('signalBars').classList.add('active');
}

function togglePlay(){
  if(!activeId)return;
  if(audio.paused){audio.play().catch(()=>{});setPlayIcon(true)}
  else{audio.pause();setPlayIcon(false)}
}

function setPlayIcon(playing){
  const icon=document.getElementById('playIcon');
  icon.setAttribute('points',playing
    ?'6,4 10,4 10,20 6,20 M14,4 18,4 18,20 14,20'
    :'5,3 19,12 5,21');
}

function setVolume(val){
  audio.volume=parseFloat(val);isMuted=false;audio.muted=false;
  document.getElementById('volIcon').textContent='🔊';
}
function toggleMute(){
  isMuted=!isMuted;audio.muted=isMuted;
  document.getElementById('volIcon').textContent=isMuted?'🔇':'🔊';
}

audio.volume=0.85;
buildTicker();buildFilters();buildGrid();

// 오류 수정 (작은따옴표 중복 제거)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(err=>console.warn('SW 등록 실패:',err));
  });
}
</script>
</body>
</html>
