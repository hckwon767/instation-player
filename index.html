<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSTATION">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>INSTATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border-bright:rgba(255,180,60,0.35);
  --gold:#f5b740;
  --gold2:#e8960a;
  --text:#e8e0d0;
  --text-muted:#7a7268;
  --text-dim:#4a4642;
  --red:#e84545;
  --mono:'Space Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --player-h:144px;
  --player-h-mobile:auto;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding:0 var(--safe-r) calc(var(--player-h) + var(--safe-b) + 20px) var(--safe-l);
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-y;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
  pointer-events:none;
  z-index:9999;
}

/* HEADER */
.header{
  padding:28px 20px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--border);
  max-width:1200px;margin:0 auto;
}
.logo-wordmark{
  font-family:var(--mono);font-size:26px;font-weight:700;
  letter-spacing:0.15em;color:var(--gold);line-height:1;
}
.logo-sub{
  font-family:var(--mono);font-size:9px;letter-spacing:0.28em;
  color:var(--text-muted);margin-top:5px;
}
.header-right{display:flex;align-items:center;gap:10px}
.signal-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.signal-bars span{
  width:4px;background:var(--gold);border-radius:1px;opacity:0.2;transition:opacity 0.3s;
}
.signal-bars span:nth-child(1){height:7px}
.signal-bars span:nth-child(2){height:12px}
.signal-bars span:nth-child(3){height:16px}
.signal-bars span:nth-child(4){height:20px}
.signal-bars.active span{animation:pulse-bar 1.4s ease-in-out infinite}
.signal-bars.active span:nth-child(1){animation-delay:0s}
.signal-bars.active span:nth-child(2){animation-delay:0.15s}
.signal-bars.active span:nth-child(3){animation-delay:0.3s}
.signal-bars.active span:nth-child(4){animation-delay:0.45s}
@keyframes pulse-bar{0%,100%{opacity:0.15}50%{opacity:1}}
.on-air{
  font-family:var(--mono);font-size:9px;letter-spacing:0.2em;
  padding:5px 9px;border:1px solid var(--red);color:var(--red);
  border-radius:3px;opacity:0;transition:opacity 0.3s;
}
.on-air.active{opacity:1;animation:blink-on-air 1.5s ease-in-out infinite}
@keyframes blink-on-air{0%,100%{opacity:1}50%{opacity:0.3}}

/* TICKER */
.ticker-wrap{
  overflow:hidden;background:var(--surface);
  border-bottom:1px solid var(--border);padding:7px 0;
}
.ticker-inner{
  display:flex;white-space:nowrap;
  animation:ticker 45s linear infinite;
}
.ticker-item{
  font-family:var(--mono);font-size:10px;
  color:var(--text-muted);letter-spacing:0.1em;padding:0 36px;
}
.ticker-item::before{content:'◆  ';color:var(--gold)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* FILTER */
.filter-wrap{
  max-width:1200px;margin:0 auto;
  padding:16px 20px 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-wrap::-webkit-scrollbar{display:none}
.filter-section{display:flex;gap:7px;flex-wrap:nowrap;width:max-content}
.filter-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
  padding:0 14px;min-height:36px;display:flex;align-items:center;
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  border-radius:2px;cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
@media(hover:hover){.filter-btn:hover{border-color:var(--gold2);color:var(--gold)}}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* GRID */
.grid-section{max-width:1200px;margin:20px auto 0;padding:0 20px}
.section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:0.3em;
  color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;padding-left:2px;
}
.channel-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:2px;
}

/* CARD */
.ch-card{
  position:relative;background:var(--surface);
  border:1px solid var(--border);cursor:pointer;
  overflow:hidden;aspect-ratio:1/1.1;
  display:flex;flex-direction:column;
  transition:border-color 0.2s;
}
.ch-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.92) 100%);
  z-index:1;
}
@media(hover:hover){
  .ch-card:hover{border-color:var(--border-bright);z-index:2;transform:scale(1.02)}
  .ch-card:hover .ch-thumb{transform:scale(1.07)}
}
@media(hover:none){.ch-card:active{border-color:var(--border-bright);opacity:0.82}}
.ch-card.active{border-color:var(--gold)}
.ch-card.active::after{
  content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--gold);z-index:10;
}
.ch-num{
  position:absolute;top:8px;left:10px;
  font-family:var(--mono);font-size:9px;
  color:var(--gold);letter-spacing:0.1em;z-index:3;opacity:0.6;
}
.ch-thumb{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.4s ease;position:absolute;inset:0;
}
.ch-thumb-placeholder{
  position:absolute;inset:0;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.ch-info{position:absolute;bottom:0;left:0;right:0;padding:10px;z-index:3}
.ch-tag{
  font-family:var(--mono);font-size:8px;letter-spacing:0.18em;
  color:var(--gold);text-transform:uppercase;margin-bottom:3px;opacity:0.85;
}
.ch-name{font-size:12px;font-weight:500;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
.ch-playing-badge{position:absolute;top:8px;right:8px;z-index:5;display:none}
.ch-card.active .ch-playing-badge{display:flex}
.ch-playing-badge svg{width:16px;height:16px}
.eq-bar{animation:eq-anim 0.6s ease-in-out infinite alternate;transform-origin:bottom}
.eq-bar:nth-child(2){animation-delay:0.15s}
.eq-bar:nth-child(3){animation-delay:0.3s}
@keyframes eq-anim{from{transform:scaleY(0.3)}to{transform:scaleY(1)}}
.ch-card.hidden-card{display:none}

/* ========= 플레이어 바 ========= */
.player-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,8,12,0.98);
  border-top:1px solid var(--border-bright);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  display:none;z-index:1000;
  height:auto;
  padding-bottom:var(--safe-b);
}
.player-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.5;
}
.player-bar.visible{display:block}
.player-inner{
  max-width:1200px;margin:0 auto;
  padding:10px 20px;
  display:flex;flex-direction:row;align-items:center;gap:14px;
}
.player-top{
  display:flex;align-items:center;gap:14px;
  flex:1;min-width:0;
}
.player-bottom{
  display:flex;align-items:center;gap:14px;flex-shrink:0;
}
.player-freq{
  font-family:var(--mono);font-size:18px;font-weight:700;
  color:var(--gold);letter-spacing:0.05em;
  flex-shrink:0;min-width:82px;text-align:right;
}
.play-btn{
  width:48px;height:48px;border-radius:50%;
  border:2px solid var(--gold);background:transparent;color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background 0.15s,color 0.15s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
@media(hover:hover){.play-btn:hover{background:var(--gold);color:#000}}
.play-btn:active{background:var(--gold);color:#000}
.play-btn svg{width:18px;height:18px}
.vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:110px}
.vol-icon{
  background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;
  min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  transition:color 0.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
@media(hover:hover){.vol-icon:hover{color:var(--gold)}}
.vol-icon:active{color:var(--gold)}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;background:var(--surface2);border-radius:2px;
  outline:none;border:none;cursor:pointer;min-width:60px;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--gold);cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
}
audio{display:none}

/* ── 앨범아트 ── */
.now-playing-album{
  width:144px;height:144px;
  border-radius:4px;flex-shrink:0;overflow:hidden;
  background:var(--surface2);border:1px solid var(--border-bright);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  transition:box-shadow 0.3s;
}
.now-playing-album img{width:100%;height:100%;object-fit:cover;display:block}
.now-playing-album .album-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;font-size:26px;
}

/* ── 곡 정보 텍스트 + 마퀴 스크롤 ── */
.now-playing-track{flex:1;min-width:0;overflow:hidden}

.np-ch-tag{
  font-family:var(--mono);font-size:13px;letter-spacing:0.2em;
  color:var(--gold);margin-bottom:4px;opacity:0.85;
  text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.np-marquee{
  overflow:hidden;
  position:relative;
  -webkit-mask-image:linear-gradient(to right, transparent 0%, black 4%, black 92%, transparent 100%);
  mask-image:linear-gradient(to right, transparent 0%, black 4%, black 92%, transparent 100%);
}
.np-marquee.short{
  -webkit-mask-image:none;
  mask-image:none;
}
.np-marquee-inner{
  display:inline-block;
  white-space:nowrap;
}
.np-marquee.scrolling .np-marquee-inner{
  animation:marquee-scroll var(--marquee-dur, 12s) linear infinite;
}
@keyframes marquee-scroll{
  0%   { transform: translateX(0); }
  100% { transform: translateX(var(--marquee-dist, -50%)); }
}

.np-title-text{
  font-size:30px;font-weight:600;color:var(--text);
  line-height:1.35;
}
.np-artist-text{
  font-size:23px;color:var(--text-muted);
  line-height:1.35;margin-top:2px;
}

.np-loading{
  font-family:var(--mono);font-size:9px;color:var(--text-dim);
  animation:np-blink 1.2s ease-in-out infinite;
}
@keyframes np-blink{0%,100%{opacity:1}50%{opacity:0.3}}
.np-spin{display:inline-block;animation:np-rotate 1s linear infinite;}
@keyframes np-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ========= 모바일 ========= */
@media (max-width: 640px) {
  body { padding-bottom: calc(100px + var(--safe-b) + 16px); }
  .player-bar { min-height: calc(92px + var(--safe-b)); }
  .player-inner { flex-direction:column;align-items:stretch;padding:10px 16px;gap:10px; }
  .player-top { width:100%;flex:none;gap:12px; }
  .now-playing-album { width:128px;height:128px; }
  .np-title-text { font-size:30px; }
  .np-artist-text { font-size:23px; }
  .player-bottom { width:100%;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px; }
  .player-freq { font-size:18px;min-width:auto;text-align:left;flex:1; }
  .play-btn { width:52px;height:52px;flex-shrink:0; }
  .vol-wrap { flex:1.2;min-width:100px;gap:8px; }
  .vol-slider { min-width:70px; }
}

@media (min-width:641px) and (max-width:900px) {
  .player-freq { font-size:16px;min-width:70px; }
  .vol-wrap { min-width:100px; }
}

@media all and (display-mode:standalone) {
  .install-banner { display:none; }
  body { padding-top:env(safe-area-inset-top); }
}

/* ========= 배경 앨범아트 레이어 (추가, 기존 코드 훼손 없음) ========= */
.bg-artwork-layer {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(40px) brightness(0.2);
  transition: opacity 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  pointer-events: none;
  z-index: -2;
}
.bg-artwork-layer.fallback {
  background-image: radial-gradient(circle at 30% 20%, #1e1a2f, #0a0a0f 80%);
}
.bg-fade-container {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
}

/* ========= 플레이어 바 배경 투명화 (배경 아트가 비치도록) ========= */
.player-bar {
  background: transparent !important;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
}
.player-bar::before {
  opacity: 0.2;
}
</style>
</head>
<body>

<!-- 배경 아트 레이어 (크로스페이드) -->
<div class="bg-fade-container" id="bgFadeContainer">
  <div class="bg-artwork-layer" id="bgLayer1" style="opacity: 1;"></div>
  <div class="bg-artwork-layer" id="bgLayer2" style="opacity: 0;"></div>
</div>

<header class="header">
  <div class="logo">
    <div class="logo-wordmark">INSTATION</div>
    <div class="logo-sub">지금, 당신만의 음악 방송</div>
  </div>
  <div class="header-right">
    <div class="signal-bars" id="signalBars">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="on-air" id="onAir">ON AIR</div>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker-inner" id="ticker"></div>
</div>

<div class="filter-wrap">
  <div class="filter-section" id="filterSection"></div>
</div>

<section class="grid-section">
  <div class="section-label" id="gridLabel">ALL CHANNELS</div>
  <div class="channel-grid" id="channelGrid"></div>
</section>

<div class="player-bar" id="playerBar">
  <div class="player-inner">
    <div class="player-top">
      <div class="now-playing-album" id="nowPlayingAlbum">
        <div class="album-placeholder">🎵</div>
      </div>
      <div class="now-playing-track" id="nowPlayingTrack">
        <div class="np-ch-tag" id="playerTag">INSTATION</div>
        <div class="np-marquee" id="titleMarquee">
          <div class="np-marquee-inner" id="titleInner">
            <span class="np-title-text" id="npTitle">–</span>
          </div>
        </div>
        <div class="np-marquee" id="artistMarquee">
          <div class="np-marquee-inner" id="artistInner">
            <span class="np-artist-text" id="npArtist"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="player-bottom">
      <div class="player-freq" id="playerFreq">–</div>
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="재생/일시정지">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21" id="playIcon"/>
        </svg>
      </button>
      <div class="vol-wrap">
        <button class="vol-icon" onclick="toggleMute()" id="volIcon" aria-label="음소거">🔊</button>
        <input type="range" min="0" max="1" step="0.01" value="0.85"
               class="vol-slider" id="volSlider" oninput="setVolume(this.value)">
      </div>
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
// ======================= 기존 코드 (수정 없음, 완전 동일) =======================
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const channels=[

  {id:13,  img:'ori_img19',  name:'랩, 힙합',               tag:'힙합',    cat:'힙합'},

  {id:214, img:'ori_img122', name:'이지리스닝 연주',        tag:'연주',    cat:'연주'},
  {id:215, img:'ori_img123', name:'힐링 피아노',            tag:'연주',    cat:'연주'},
  {id:216, img:'ori_img124', name:'아침 이지리스닝',        tag:'연주',    cat:'연주'},
  {id:217, img:'ori_img125', name:'재즈힙합 라운지',        tag:'재즈',    cat:'재즈'},
  {id:218, img:'ori_img126', name:'보사노바 & 라틴',        tag:'연주',    cat:'연주'},
];

const BASE_IMG='https://cdn.inlive.co.kr/inLive/image/instation/';
const audio=document.getElementById('audioEl');
let activeId=null,isMuted=false;

function getPort(id){return 10000+id*10}
function fakeFreq(id){
  const idx=channels.findIndex(c=>c.id===id);
  return (87.5+(108-87.5)/channels.length*idx).toFixed(1)+' FM';
}

/* ── 마퀴 스크롤 설정 ───────────────────────── */
function applyMarquee(marqueeEl, innerEl, textEl){
  marqueeEl.classList.remove('scrolling','short');
  innerEl.style.animation='';
  const clone = innerEl.querySelector('.np-marquee-clone');
  if(clone) clone.remove();

  requestAnimationFrame(()=>{
    const containerW = marqueeEl.offsetWidth;
    const textW      = textEl.offsetWidth;

    if(textW <= containerW){
      marqueeEl.classList.add('short');
      return;
    }

    const gap = 80;
    const cloneSpan = textEl.cloneNode(true);
    cloneSpan.classList.add('np-marquee-clone');
    cloneSpan.style.paddingLeft = gap + 'px';
    innerEl.appendChild(cloneSpan);

    const totalW  = textW + gap;
    const speed   = 60;
    const dur     = totalW / speed;

    innerEl.style.setProperty('--marquee-dist', `-${totalW}px`);
    innerEl.style.setProperty('--marquee-dur',  `${dur}s`);
    marqueeEl.classList.add('scrolling');
  });
}

function setMarqueeText(marqueeId, innerId, spanId, text){
  const marqueeEl = document.getElementById(marqueeId);
  const innerEl   = document.getElementById(innerId);
  const spanEl    = document.getElementById(spanId);
  spanEl.textContent = text;
  applyMarquee(marqueeEl, innerEl, spanEl);
}

function buildTicker(){
  const names=channels.map(c=>c.name);
  document.getElementById('ticker').innerHTML=
    [...names,...names].map(n=>`<span class="ticker-item">${n}</span>`).join('');
}

function buildFilters(){
  const cats=['ALL',...new Set(channels.map(c=>c.cat))];
  const sec=document.getElementById('filterSection');
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'+(cat==='ALL'?' active':'');
    btn.textContent=cat;
    btn.addEventListener('click',()=>applyFilter(cat,btn));
    sec.appendChild(btn);
  });
}

function applyFilter(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.ch-card').forEach(c=>{
    c.classList.toggle('hidden-card',cat!=='ALL'&&c.dataset.cat!==cat);
  });
  document.getElementById('gridLabel').textContent=
    cat==='ALL'?'ALL CHANNELS':cat.toUpperCase()+' CHANNELS';
}

function buildGrid(){
  const grid=document.getElementById('channelGrid');
  channels.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='ch-card';
    card.dataset.id=ch.id;
    card.dataset.cat=ch.cat;
    const imgSrc=`${BASE_IMG}${ch.img}.png`;
    card.innerHTML=`
      <img class="ch-thumb" src="${imgSrc}" alt="${ch.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="ch-thumb-placeholder" style="display:none">🎵</div>
      <div class="ch-num">CH ${String(i+1).padStart(2,'0')}</div>
      <div class="ch-playing-badge">
        <svg viewBox="0 0 18 18" fill="#f5b740">
          <rect class="eq-bar" x="1" y="4" width="3" height="10" rx="1"/>
          <rect class="eq-bar" x="7" y="2" width="3" height="14" rx="1"/>
          <rect class="eq-bar" x="13" y="5" width="3" height="9" rx="1"/>
        </svg>
      </div>
      <div class="ch-info">
        <div class="ch-tag">${ch.tag}</div>
        <div class="ch-name">${ch.name}</div>
      </div>`;
    card.addEventListener('click',()=>playChannel(ch,card,imgSrc));
    grid.appendChild(card);
  });
}

function playChannel(ch,card,imgSrc){
  if(activeId===ch.id){togglePlay();return}
  activeId=ch.id;
  document.querySelectorAll('.ch-card').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  audio.src=`https://live01.inlive.co.kr/listen.html?port=${getPort(ch.id)}`;
  audio.play().catch(()=>{});
  document.getElementById('playerBar').classList.add('visible');
  document.getElementById('playerTag').textContent=ch.tag.toUpperCase();
  document.getElementById('playerFreq').textContent=fakeFreq(ch.id);
  setMarqueeText('titleMarquee','titleInner','npTitle','–');
  setMarqueeText('artistMarquee','artistInner','npArtist','');
  document.getElementById('nowPlayingAlbum').innerHTML='<div class="album-placeholder">🎵</div>';
  setPlayIcon(true);
  document.getElementById('onAir').classList.add('active');
  document.getElementById('signalBars').classList.add('active');
  startNowPlaying();
}

function togglePlay(){
  if(!activeId)return;
  if(audio.paused){
    audio.play().catch(()=>{});
    setPlayIcon(true);
    startNowPlaying();
  }else{
    audio.pause();
    setPlayIcon(false);
    stopNowPlaying();
  }
}

function setPlayIcon(playing){
  const icon=document.getElementById('playIcon');
  icon.setAttribute('points',playing
    ?'6,4 10,4 10,20 6,20 M14,4 18,4 18,20 14,20'
    :'5,3 19,12 5,21');
}

function setVolume(val){
  audio.volume=parseFloat(val);isMuted=false;audio.muted=false;
  document.getElementById('volIcon').textContent='🔊';
}
function toggleMute(){
  isMuted=!isMuted;audio.muted=isMuted;
  document.getElementById('volIcon').textContent=isMuted?'🔇':'🔊';
}

audio.volume=1.00;
buildTicker();buildFilters();buildGrid();

/* =============================================
   NOW PLAYING (원본 그대로)
   ============================================= */
let npTimer=null;
let lastTrackStr='';
let currentArtUrl=null;

async function fetchStatsMeta(port){
  const url=`https://live01.inlive.co.kr/stats.html?port=${port}`;
  try{
    const res=await fetch(url,{cache:'no-store',headers:{'Accept':'text/html,application/json,*/*'}});
    if(!res.ok) return null;
    const ct=res.headers.get('content-type')||'';
    if(ct.includes('json')){
      const data=await res.json();
      const title=data.title||data.currenttitle||data.current_song||data.songtitle||'';
      const artist=data.artist||data.currentartist||'';
      if(title||artist) return parseArtistTitle(artist,title);
      return null;
    }
    return parseStatsHtml(await res.text());
  }catch(e){
    console.debug('[NP] stats.html fetch 실패:', e.message);
    return null;
  }
}

function parseStatsHtml(html){
  const plain=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const parts=plain.split(',');
  if(parts.length>=6) return parseArtistTitle('',parts.slice(5).join(',').trim());
  if(plain.length>1 && plain.length<300) return parseArtistTitle('',plain);
  return null;
}

function parseArtistTitle(artist,raw){
  raw=(raw||'').trim();
  if(!raw && !artist) return null;
  if(!artist && raw.includes(' - ')){
    const idx=raw.indexOf(' - ');
    return {artist:raw.slice(0,idx).trim(), title:raw.slice(idx+3).trim()};
  }
  return {artist:(artist||'').trim(), title:raw};
}

async function fetchStatsMetaViaProxy(port){
  const target=encodeURIComponent(`https://live01.inlive.co.kr/stats.html?port=${port}`);
  const proxy=`https://api.allorigins.win/get?url=${target}`;
  try{
    const res=await fetch(proxy,{cache:'no-store'});
    if(!res.ok) return null;
    const data=await res.json();
    if(data.contents) return parseStatsHtml(data.contents);
    return null;
  }catch(e){
    console.debug('[NP] proxy fetch 실패:', e.message);
    return null;
  }
}

async function fetchAlbumArt(artist,title){
  try{
    const q=encodeURIComponent((artist?`${artist} `:'')+title);
    const res=await fetch(
      `https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=3`,
      {cache:'default'}
    );
    if(!res.ok) return null;
    const data=await res.json();
    if(!data.results?.length) return null;
    return data.results[0].artworkUrl100.replace('100x100bb','600x600bb');
  }catch(e){return null;}
}

function updateNowPlayingUI(artist, title, artUrl, loading=false){
  const albumEl = document.getElementById('nowPlayingAlbum');

  if(loading){
    albumEl.innerHTML='<div class="album-placeholder"><span class="np-spin">⟳</span></div>';
    setMarqueeText('titleMarquee','titleInner','npTitle','불러오는 중...');
    setMarqueeText('artistMarquee','artistInner','npArtist','');
    return;
  }

  setMarqueeText('titleMarquee','titleInner','npTitle', title||'–');
  setMarqueeText('artistMarquee','artistInner','npArtist', artist||'');

  if(artUrl !== undefined){
    albumEl.innerHTML='';
    if(artUrl){
      const img=new Image();
      img.alt=title;
      img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
      img.onload=()=>{albumEl.innerHTML='';albumEl.appendChild(img);};
      img.onerror=()=>{albumEl.innerHTML='<div class="album-placeholder">🎵</div>';};
      img.src=artUrl;
      currentArtUrl=artUrl;
    }else{
      albumEl.innerHTML='<div class="album-placeholder">🎵</div>';
      currentArtUrl=null;
    }
  }
}

async function pollNowPlaying(){
  if(!activeId) return;
  const port=getPort(activeId);
  let meta=await fetchStatsMeta(port);
  if(!meta) meta=await fetchStatsMetaViaProxy(port);
  if(!meta) return;

  const trackStr=`${meta.artist}||${meta.title}`;
  if(trackStr===lastTrackStr) return;
  lastTrackStr=trackStr;

  updateNowPlayingUI(meta.artist, meta.title, undefined);

  const art=await fetchAlbumArt(meta.artist, meta.title);
  if(lastTrackStr===`${meta.artist}||${meta.title}`){
    updateNowPlayingUI(meta.artist, meta.title, art||null);
  }
}

function startNowPlaying(){
  lastTrackStr='';currentArtUrl=null;
  if(npTimer) clearInterval(npTimer);
  updateNowPlayingUI('','','',true);
  pollNowPlaying();
  npTimer=setInterval(pollNowPlaying,12000);
}

function stopNowPlaying(){
  if(npTimer){clearInterval(npTimer);npTimer=null;}
  setMarqueeText('titleMarquee','titleInner','npTitle','–');
  setMarqueeText('artistMarquee','artistInner','npArtist','');
  document.getElementById('nowPlayingAlbum').innerHTML='<div class="album-placeholder">🎵</div>';
  lastTrackStr='';currentArtUrl=null;
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .catch(err=>console.warn('SW 등록 실패:',err));
  });
}

function adjustBodyPadding(){
  const bar = document.getElementById('playerBar');
  if(bar.classList.contains('visible')){
    document.body.style.paddingBottom = (bar.offsetHeight + 16) + 'px';
  }
}
const resizeObserver = new ResizeObserver(adjustBodyPadding);
resizeObserver.observe(document.getElementById('playerBar'));
window.addEventListener('resize', adjustBodyPadding);

// ========== 추가 기능: 배경 앨범아트 + 크로스페이드 (기존 코드 수정 없음) ==========
(function setupArtworkBackground() {
  const bg1 = document.getElementById('bgLayer1');
  const bg2 = document.getElementById('bgLayer2');
  let activeLayer = 1; // 1 or 2
  let pendingImageUrl = null;
  let isTransitioning = false;
  
  // fallback 배경 적용
  function setFallbackBackground(targetLayer) {
    targetLayer.classList.add('fallback');
    targetLayer.style.backgroundImage = ''; // clear url
  }
  
  function clearFallback(targetLayer) {
    targetLayer.classList.remove('fallback');
  }
  
  // 실제 배경 이미지 업데이트 (크로스페이드)
  function updateBackgroundWithFade(artUrl) {
    if (isTransitioning) return;
    
    const nextLayer = (activeLayer === 1) ? bg2 : bg1;
    const prevLayer = (activeLayer === 1) ? bg1 : bg2;
    
    // 새 레이어에 이미지 설정 또는 fallback
    if (artUrl && artUrl.trim() !== '') {
      clearFallback(nextLayer);
      // preload image
      const imgTest = new Image();
      imgTest.crossOrigin = 'Anonymous';
      imgTest.onload = () => {
        nextLayer.style.backgroundImage = `url('${artUrl}')`;
        nextLayer.style.opacity = '1';
        prevLayer.style.opacity = '0';
        activeLayer = (activeLayer === 1) ? 2 : 1;
        isTransitioning = false;
      };
      imgTest.onerror = () => {
        // 로드 실패시 fallback
        setFallbackBackground(nextLayer);
        nextLayer.style.opacity = '1';
        prevLayer.style.opacity = '0';
        activeLayer = (activeLayer === 1) ? 2 : 1;
        isTransitioning = false;
      };
      imgTest.src = artUrl;
    } else {
      // artUrl 없으면 fallback 그라데이션
      setFallbackBackground(nextLayer);
      nextLayer.style.opacity = '1';
      prevLayer.style.opacity = '0';
      activeLayer = (activeLayer === 1) ? 2 : 1;
      isTransitioning = false;
    }
    isTransitioning = true;
    // 타임아웃 방어
    setTimeout(() => { if(isTransitioning) isTransitioning = false; }, 800);
  }
  
  // 원본 updateNowPlayingUI 가로채기 (함수 덮어쓰기, 기존 함수 보존)
  const originalUpdateNowPlayingUI = window.updateNowPlayingUI;
  window.updateNowPlayingUI = function(artist, title, artUrl, loading) {
    // 원본 호출
    originalUpdateNowPlayingUI(artist, title, artUrl, loading);
    
    // 로딩 중이 아니고, artUrl이 정의된 경우에 배경 업데이트
    if (!loading && artUrl !== undefined) {
      if (artUrl && typeof artUrl === 'string' && artUrl.startsWith('http')) {
        updateBackgroundWithFade(artUrl);
      } else if (!artUrl) {
        // 앨범아트 없는 경우 (클래식, 연주곡 등) fallback 배경 적용
        updateBackgroundWithFade(null);
      }
    }
    // 만약 loading 중이고 이전 배경을 유지하고 싶다면 아무것도 안함 (기존 배경 유지)
  };
  
  // stopNowPlaying 오버라이드 (배경 리셋)
  const originalStopNowPlaying = window.stopNowPlaying;
  window.stopNowPlaying = function() {
    originalStopNowPlaying();
    // fallback 배경으로 리셋 (두 레이어 모두 스타일 조정, 하지만 fade는 최소화)
    const fallbackUrl = null;
    if (activeLayer === 1) {
      setFallbackBackground(bg1);
      bg1.style.opacity = '1';
      bg2.style.opacity = '0';
      bg2.style.backgroundImage = '';
    } else {
      setFallbackBackground(bg2);
      bg2.style.opacity = '1';
      bg1.style.opacity = '0';
      bg1.style.backgroundImage = '';
    }
    activeLayer = (activeLayer === 1) ? 1 : 2;
    isTransitioning = false;
  };
  
  // startNowPlaying 오버라이드: 로딩 중에도 배경 유지 위해 fallback 유지 또는 이전 배경 잔류
  const originalStartNowPlaying = window.startNowPlaying;
  window.startNowPlaying = function() {
    originalStartNowPlaying();
    // 로딩 상태에서는 배경을 건드리지 않음 (마지막 유효 배경 or fallback)
  };
  
  // 초기 fallback 적용
  setFallbackBackground(bg1);
  bg1.style.opacity = '1';
  bg2.style.opacity = '0';
  activeLayer = 1;
  isTransitioning = false;
  
  // 재생 중이 아닐 때 기본 fallback 표시 유지
})();
</script>
