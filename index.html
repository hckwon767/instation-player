<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSTATION">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>INSTATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border-bright:rgba(255,180,60,0.35);
  --gold:#f5b740;
  --gold2:#e8960a;
  --accent:var(--gold);
  --text:#e8e0d0;
  --text-muted:#7a7268;
  --text-dim:#4a4642;
  --red:#e84545;
  --mono:'Space Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding:0 var(--safe-r) 180px var(--safe-l);
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-y;
}

/* CRT 스캔라인 오버레이 */
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:9998;
}

/* =============================================
   IMMERSIVE BACKGROUND — 데스크탑 전체 배경
   ============================================= */
.bg-art-layer{
  position:fixed;inset:0;z-index:-3;
  background-size:cover;background-position:center;
  filter:blur(10px) brightness(0.35) saturate(1.6);
  transform:scale(1.15);
  opacity:0;
  transition:opacity 1.2s ease;
  will-change:opacity;
  pointer-events:none;
}
.bg-art-layer.active{opacity:1}

/* 배경 위 그라데이션 vignette */
.bg-vignette{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* 모바일에서는 전체 배경 비활성 */
@media(max-width:640px){
  .bg-art-layer,.bg-vignette{display:none}
}

/* =============================================
   HEADER
   ============================================= */
.header{
  padding:28px 20px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--border);
  max-width:1200px;margin:0 auto;
  position:relative;z-index:10;
}
.logo-wordmark{
  font-family:var(--mono);font-size:26px;font-weight:700;
  letter-spacing:0.15em;color:var(--accent);line-height:1;
  text-shadow:0 0 30px rgba(245,183,64,0.4);
  transition:text-shadow 0.8s ease;
}
.logo-sub{
  font-family:var(--mono);font-size:9px;letter-spacing:0.28em;
  color:var(--text-muted);margin-top:5px;
}
.header-right{display:flex;align-items:center;gap:10px}

/* 시그널 바 */
.signal-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.signal-bars span{
  width:4px;background:var(--accent);border-radius:1px;opacity:0.2;
  transition:opacity 0.3s,background 0.8s;
}
.signal-bars span:nth-child(1){height:7px}
.signal-bars span:nth-child(2){height:12px}
.signal-bars span:nth-child(3){height:16px}
.signal-bars span:nth-child(4){height:20px}
.signal-bars.active span{animation:pulse-bar 1.4s ease-in-out infinite}
.signal-bars.active span:nth-child(1){animation-delay:0s}
.signal-bars.active span:nth-child(2){animation-delay:0.15s}
.signal-bars.active span:nth-child(3){animation-delay:0.3s}
.signal-bars.active span:nth-child(4){animation-delay:0.45s}
@keyframes pulse-bar{0%,100%{opacity:0.15}50%{opacity:1}}

.on-air{
  font-family:var(--mono);font-size:9px;letter-spacing:0.2em;
  padding:5px 9px;border:1px solid var(--red);color:var(--red);
  border-radius:3px;opacity:0;transition:opacity 0.3s;
}
.on-air.active{opacity:1;animation:blink-on-air 1.5s ease-in-out infinite}
@keyframes blink-on-air{0%,100%{opacity:1}50%{opacity:0.3}}

/* =============================================
   TICKER
   ============================================= */
.ticker-wrap{
  overflow:hidden;
  background:rgba(17,17,24,0.6);
  border-bottom:1px solid var(--border);padding:7px 0;
  position:relative;z-index:10;
  backdrop-filter:blur(8px);
}
.ticker-inner{
  display:flex;white-space:nowrap;
  animation:ticker 45s linear infinite;
}
.ticker-item{
  font-family:var(--mono);font-size:10px;
  color:var(--text-muted);letter-spacing:0.1em;padding:0 36px;
}
.ticker-item::before{content:'◆  ';color:var(--accent)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* =============================================
   FILTER
   ============================================= */
.filter-wrap{
  max-width:1200px;margin:0 auto;
  padding:16px 20px 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  position:relative;z-index:10;
}
.filter-wrap::-webkit-scrollbar{display:none}
.filter-section{display:flex;gap:7px;flex-wrap:nowrap;width:max-content}
.filter-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
  padding:0 14px;min-height:36px;display:flex;align-items:center;
  background:rgba(17,17,24,0.5);
  border:1px solid var(--border);color:var(--text-muted);
  border-radius:2px;cursor:pointer;transition:all 0.2s;white-space:nowrap;
  backdrop-filter:blur(8px);
}
@media(hover:hover){.filter-btn:hover{border-color:var(--accent);color:var(--accent)}}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

/* =============================================
   GRID
   ============================================= */
.grid-section{max-width:1200px;margin:20px auto 0;padding:0 20px;position:relative;z-index:10}
.section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:0.3em;
  color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;padding-left:2px;
}
.channel-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:2px;
}

/* =============================================
   CARD
   ============================================= */
.ch-card{
  position:relative;
  background:rgba(17,17,24,0.7);
  border:1px solid var(--border);cursor:pointer;
  overflow:hidden;aspect-ratio:1/1.1;
  display:flex;flex-direction:column;
  transition:border-color 0.3s,box-shadow 0.3s,transform 0.2s;
}
.ch-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.92) 100%);
  z-index:1;
}
/* 유리 반사 레이어 */
.ch-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 50%);
  z-index:2;pointer-events:none;
}
@media(hover:hover){
  .ch-card:hover{
    border-color:var(--border-bright);
    box-shadow:0 0 20px rgba(245,183,64,0.1);
    z-index:2;transform:scale(1.02);
  }
  .ch-card:hover .ch-thumb{transform:scale(1.07)}
}
@media(hover:none){.ch-card:active{border-color:var(--border-bright);opacity:0.82}}
.ch-card.active{
  border-color:var(--accent);
  box-shadow:0 0 24px rgba(245,183,64,0.2);
}
.ch-card.active .ch-top-line{
  position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--accent);z-index:10;
}
.ch-top-line{display:none}
.ch-card.active .ch-top-line{display:block}

.ch-num{
  position:absolute;top:8px;left:10px;
  font-family:var(--mono);font-size:9px;
  color:var(--accent);letter-spacing:0.1em;z-index:3;opacity:0.6;
}
.ch-thumb{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.4s ease;position:absolute;inset:0;
}
.ch-thumb-placeholder{
  position:absolute;inset:0;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.ch-info{position:absolute;bottom:0;left:0;right:0;padding:10px;z-index:3}
.ch-tag{
  font-family:var(--mono);font-size:8px;letter-spacing:0.18em;
  color:var(--accent);text-transform:uppercase;margin-bottom:3px;opacity:0.85;
}
.ch-name{font-size:12px;font-weight:500;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
.ch-playing-badge{position:absolute;top:8px;right:8px;z-index:5;display:none}
.ch-card.active .ch-playing-badge{display:flex}
.ch-playing-badge svg{width:16px;height:16px}
.eq-bar{animation:eq-anim 0.6s ease-in-out infinite alternate;transform-origin:bottom}
.eq-bar:nth-child(2){animation-delay:0.15s}
.eq-bar:nth-child(3){animation-delay:0.3s}
@keyframes eq-anim{from{transform:scaleY(0.3)}to{transform:scaleY(1)}}
.ch-card.hidden-card{display:none}

/* =============================================
   PLAYER BAR
   ============================================= */
.player-bar{
  position:fixed;bottom:0;left:0;right:0;
  display:none;z-index:1000;
  overflow:hidden;
  padding-bottom:var(--safe-b);
  /* 기본 반투명 배경 — 앨범아트 없을 때 */
  background:rgba(6,6,10,0.92);
  border-top:1px solid rgba(255,180,60,0.2);
}
.player-bar.visible{display:block}

/* 골드 상단 라인 */
.player-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0.6;z-index:5;
}

/* 앨범아트 블러 배경 — 두 레이어 crossfade */
.player-bg-a,
.player-bg-b{
  position:absolute;inset:-30px;
  background-size:cover;background-position:center;
  filter:blur(40px) brightness(0.22) saturate(1.5);
  opacity:0;
  transition:opacity 1s ease;
  z-index:0;
  pointer-events:none;
}
.player-bg-a.active,.player-bg-b.active{opacity:1}

/* 플레이어 내부 암막 오버레이 (텍스트 가독성) */
.player-overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(
    to right,
    rgba(0,0,0,0.3) 0%,
    rgba(0,0,0,0.1) 50%,
    rgba(0,0,0,0.3) 100%
  );
  pointer-events:none;
}

.player-inner{
  max-width:1200px;margin:0 auto;
  padding:12px 20px;
  display:flex;flex-direction:row;align-items:center;gap:16px;
  position:relative;z-index:2;
}
.player-top{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.player-bottom{display:flex;align-items:center;gap:14px;flex-shrink:0}

/* 앨범아트 */
.now-playing-album{
  width:144px;height:144px;
  border-radius:6px;flex-shrink:0;overflow:hidden;
  background:var(--surface2);
  border:1px solid rgba(255,180,60,0.25);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
  transition:box-shadow 0.8s ease,border-color 0.8s ease;
}
.now-playing-album img{width:100%;height:100%;object-fit:cover;display:block}
.now-playing-album .album-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;
}
.now-playing-album.has-art{
  box-shadow:0 4px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,180,60,0.3);
}

/* 곡 정보 */
.now-playing-track{flex:1;min-width:0;overflow:hidden}
.np-ch-tag{
  font-family:var(--mono);font-size:13px;letter-spacing:0.2em;
  color:var(--accent);margin-bottom:6px;opacity:0.9;
  text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.8s ease;
}

/* 마퀴 */
.np-marquee{
  overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,black 4%,black 92%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,black 4%,black 92%,transparent 100%);
}
.np-marquee.short{-webkit-mask-image:none;mask-image:none}
.np-marquee-inner{display:inline-block;white-space:nowrap}
.np-marquee.scrolling .np-marquee-inner{
  animation:marquee-scroll var(--marquee-dur,12s) linear infinite;
}
@keyframes marquee-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(var(--marquee-dist,-50%))}
}
.np-title-text{
  font-size:30px;font-weight:600;color:var(--text);
  line-height:1.35;transition:color 0.8s ease;
}
.np-artist-text{
  font-size:23px;color:var(--text-muted);
  line-height:1.35;margin-top:2px;transition:color 0.8s ease;
}
.np-loading{
  font-family:var(--mono);font-size:9px;color:var(--text-dim);
  animation:np-blink 1.2s ease-in-out infinite;
}
@keyframes np-blink{0%,100%{opacity:1}50%{opacity:0.3}}
.np-spin{display:inline-block;animation:np-rotate 1s linear infinite}
@keyframes np-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* 컨트롤 */
.player-freq{
  font-family:var(--mono);font-size:18px;font-weight:700;
  color:var(--accent);letter-spacing:0.05em;
  flex-shrink:0;min-width:82px;text-align:right;
  transition:color 0.8s ease;
  text-shadow:0 0 20px rgba(245,183,64,0.5);
}
.play-btn{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--accent);background:transparent;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background 0.15s,color 0.15s,border-color 0.8s,box-shadow 0.8s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  box-shadow:0 0 16px rgba(245,183,64,0.2);
}
@media(hover:hover){.play-btn:hover{background:var(--accent);color:#000}}
.play-btn:active{background:var(--accent);color:#000}
.play-btn svg{width:20px;height:20px}
.vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:110px}
.vol-icon{
  background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  transition:color 0.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
@media(hover:hover){.vol-icon:hover{color:var(--accent)}}
.vol-icon:active{color:var(--accent)}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;background:rgba(255,255,255,0.1);border-radius:2px;
  outline:none;border:none;cursor:pointer;min-width:60px;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
}
audio{display:none}

/* =============================================
   모바일 — 플레이어 바만 immersive, 탭바 포함
   ============================================= */
@media(max-width:640px){
  body{padding-bottom:200px}

  .player-inner{flex-direction:column;align-items:stretch;padding:12px 16px;gap:10px}
  .player-top{width:100%;flex:none;gap:12px}
  .now-playing-album{width:120px;height:120px}
  .np-title-text{font-size:28px}
  .np-artist-text{font-size:21px}
  .player-bottom{
    width:100%;display:flex;flex-direction:row;
    align-items:center;justify-content:space-between;gap:10px;
  }
  .player-freq{font-size:16px;min-width:auto;text-align:left;flex:1}
  .play-btn{width:52px;height:52px;flex-shrink:0}
  .vol-wrap{flex:1.2;min-width:90px;gap:8px}
  .vol-slider{min-width:60px}
}

@media(min-width:641px) and (max-width:900px){
  .player-freq{font-size:16px;min-width:70px}
  .vol-wrap{min-width:100px}
}

@media all and (display-mode:standalone){
  .install-banner{display:none}
  body{padding-top:env(safe-area-inset-top)}
}
</style>
</head>
<body>

<!-- Immersive background layers (데스크탑) -->
<div class="bg-art-layer bg-art-a" id="bgArtA"></div>
<div class="bg-art-layer bg-art-b" id="bgArtB"></div>
<div class="bg-vignette"></div>

<header class="header">
  <div class="logo">
    <div class="logo-wordmark">INSTATION</div>
    <div class="logo-sub">지금, 당신만의 음악 방송</div>
  </div>
  <div class="header-right">
    <div class="signal-bars" id="signalBars">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="on-air" id="onAir">ON AIR</div>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker-inner" id="ticker"></div>
</div>

<div class="filter-wrap">
  <div class="filter-section" id="filterSection"></div>
</div>

<section class="grid-section">
  <div class="section-label" id="gridLabel">ALL CHANNELS</div>
  <div class="channel-grid" id="channelGrid"></div>
</section>

<!-- Player Bar -->
<div class="player-bar" id="playerBar">
  <!-- crossfade 배경 레이어 (모바일 immersive) -->
  <div class="player-bg-a" id="playerBgA"></div>
  <div class="player-bg-b" id="playerBgB"></div>
  <div class="player-overlay"></div>

  <div class="player-inner">
    <div class="player-top">
      <div class="now-playing-album" id="nowPlayingAlbum">
        <div class="album-placeholder">🎵</div>
      </div>
      <div class="now-playing-track" id="nowPlayingTrack">
        <div class="np-ch-tag" id="playerTag">INSTATION</div>
        <div class="np-marquee" id="titleMarquee">
          <div class="np-marquee-inner" id="titleInner">
            <span class="np-title-text" id="npTitle">–</span>
          </div>
        </div>
        <div class="np-marquee" id="artistMarquee">
          <div class="np-marquee-inner" id="artistInner">
            <span class="np-artist-text" id="npArtist"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="player-bottom">
      <div class="player-freq" id="playerFreq">–</div>
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="재생/일시정지">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21" id="playIcon"/>
        </svg>
      </button>
      <div class="vol-wrap">
        <button class="vol-icon" onclick="toggleMute()" id="volIcon" aria-label="음소거">🔊</button>
        <input type="range" min="0" max="1" step="0.01" value="0.85"
               class="vol-slider" id="volSlider" oninput="setVolume(this.value)">
      </div>
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const channels=[
  {id:1,   img:'ori_img1',   name:'인기가요 TOP 100',       tag:'가요',    cat:'가요'},
  {id:2,   img:'ori_img2',   name:'빌보드 POP 100',         tag:'POP',     cat:'POP'},
  {id:3,   img:'ori_img3',   name:'하루종일 신나는 음악',   tag:'음악방송',cat:'음악방송'},
  {id:4,   img:'ori_img4',   name:'하루종일 잔잔한 음악',   tag:'음악방송',cat:'음악방송'},

function getPort(id){return 10000+id*10}
function fakeFreq(id){
  const idx=channels.findIndex(c=>c.id===id);
  return (87.5+(108-87.5)/channels.length*idx).toFixed(1)+' FM';
}

/* =============================================
   IMMERSIVE BACKGROUND — crossfade 엔진
   ============================================= */
const FALLBACK_BG=[
  'linear-gradient(135deg,#1d1f27 0%,#0a0a0f 100%)',
  'linear-gradient(135deg,#241920 0%,#0a0a0f 100%)',
  'linear-gradient(135deg,#182127 0%,#0a0a0f 100%)',
  'linear-gradient(135deg,#211826 0%,#0a0a0f 100%)',
];

let activeBgSlot='a'; // 'a' or 'b'

function getFallback(){
  return FALLBACK_BG[(activeId||0) % FALLBACK_BG.length];
}

function setImmersiveBg(imageUrl){
  const layerA=document.getElementById('bgArtA');
  const layerB=document.getElementById('bgArtB');
  const pBgA  =document.getElementById('playerBgA');
  const pBgB  =document.getElementById('playerBgB');

  const isA   = activeBgSlot==='a';
  const next  = isA ? layerB  : layerA;
  const curr  = isA ? layerA  : layerB;
  const pNext = isA ? pBgB    : pBgA;
  const pCurr = isA ? pBgA    : pBgB;

  const bgVal = imageUrl ? `url("${imageUrl}")` : 'none';
  const bgStyle= imageUrl ? `url("${imageUrl}")` : getFallback();

  // 데스크탑 전체 배경
  next.style.backgroundImage = bgVal;
  next.style.background      = imageUrl ? '' : getFallback();
  if(imageUrl){
    next.style.backgroundImage=bgVal;
    next.style.backgroundSize='cover';
    next.style.backgroundPosition='center';
  }else{
    next.style.backgroundImage='none';
    next.style.background=getFallback();
  }

  // 모바일 플레이어 배경
  if(imageUrl){
    pNext.style.backgroundImage=bgVal;
    pNext.style.backgroundSize='cover';
    pNext.style.backgroundPosition='center';
  }else{
    pNext.style.backgroundImage='none';
    pNext.style.background=getFallback();
  }

  // crossfade
  requestAnimationFrame(()=>{
    next.classList.add('active');
    pNext.classList.add('active');
    curr.classList.remove('active');
    pCurr.classList.remove('active');
  });

  activeBgSlot = isA ? 'b' : 'a';
}

/* =============================================
   마퀴 스크롤
   ============================================= */
function applyMarquee(marqueeEl,innerEl,textEl){
  marqueeEl.classList.remove('scrolling','short');
  innerEl.style.animation='';
  const clone=innerEl.querySelector('.np-marquee-clone');
  if(clone) clone.remove();

  requestAnimationFrame(()=>{
    const containerW=marqueeEl.offsetWidth;
    const textW=textEl.offsetWidth;
    if(textW<=containerW){marqueeEl.classList.add('short');return}

    const gap=80;
    const cloneSpan=textEl.cloneNode(true);
    cloneSpan.classList.add('np-marquee-clone');
    cloneSpan.style.paddingLeft=gap+'px';
    innerEl.appendChild(cloneSpan);

    const totalW=textW+gap;
    const dur=totalW/60;
    innerEl.style.setProperty('--marquee-dist',`-${totalW}px`);
    innerEl.style.setProperty('--marquee-dur',`${dur}s`);
    marqueeEl.classList.add('scrolling');
  });
}

function setMarqueeText(mId,iId,sId,text){
  const m=document.getElementById(mId);
  const i=document.getElementById(iId);
  const s=document.getElementById(sId);
  s.textContent=text;
  applyMarquee(m,i,s);
}

function buildTicker(){

  document.getElementById('ticker').innerHTML=

}

function buildFilters(){
  const cats=['ALL',...new Set(channels.map(c=>c.cat))];
  const sec=document.getElementById('filterSection');
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'+(cat==='ALL'?' active':'');
    btn.textContent=cat;
    btn.addEventListener('click',()=>applyFilter(cat,btn));
    sec.appendChild(btn);
  });
}

function applyFilter(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.ch-card').forEach(c=>{
    c.classList.toggle('hidden-card',cat!=='ALL'&&c.dataset.cat!==cat);
  });
  document.getElementById('gridLabel').textContent=
    cat==='ALL'?'ALL CHANNELS':cat.toUpperCase()+' CHANNELS';
}

function buildGrid(){
  const grid=document.getElementById('channelGrid');
  channels.forEach((ch,i)=>{
    const card=document.createElement('div');

           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">

      <div class="ch-num">CH ${String(i+1).padStart(2,'0')}</div>

          <rect class="eq-bar" x="1" y="4" width="3" height="10" rx="1"/>
          <rect class="eq-bar" x="7" y="2" width="3" height="14" rx="1"/>

      </div>
      <div class="ch-info">
        <div class="ch-tag">${ch.tag}</div>

    card.addEventListener('click',()=>playChannel(ch,card,imgSrc));

}

function playChannel(ch,card){

  activeId=ch.id;

  card.classList.add('active');

function togglePlay(){
  if(!activeId)return;
  if(audio.paused){audio.play().catch(()=>{});setPlayIcon(true);startNowPlaying()}
  else{audio.pause();setPlayIcon(false);stopNowPlaying()}
}

/* =============================================
   NOW PLAYING
   ============================================= */
let npTimer=null,lastTrackStr='',currentArtUrl=null;

async function fetchStatsMeta(port){
  try{
    const res=await fetch(`https://live01.inlive.co.kr/stats.html?port=${port}`,
      {cache:'no-store',headers:{'Accept':'text/html,application/json,*/*'}});
    if(!res.ok) return null;
    const ct=res.headers.get('content-type')||'';
    if(ct.includes('json')){
      const d=await res.json();
      const title=d.title||d.currenttitle||d.current_song||d.songtitle||'';
      const artist=d.artist||d.currentartist||'';
      if(title||artist) return parseArtistTitle(artist,title);
      return null;
    }
    return parseStatsHtml(await res.text());
  }catch(e){console.debug('[NP] stats.html 실패:',e.message);return null}
}

function parseStatsHtml(html){
  const plain=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const parts=plain.split(',');
  if(parts.length>=6) return parseArtistTitle('',parts.slice(5).join(',').trim());
  if(plain.length>1&&plain.length<300) return parseArtistTitle('',plain);
  return null;
}

function parseArtistTitle(artist,raw){
  raw=(raw||'').trim();
  if(!raw&&!artist) return null;
  if(!artist&&raw.includes(' - ')){
    const idx=raw.indexOf(' - ');
    return {artist:raw.slice(0,idx).trim(),title:raw.slice(idx+3).trim()};
  }
  return {artist:(artist||'').trim(),title:raw};
}

async function fetchStatsMetaViaProxy(port){
  const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(`https://live01.inlive.co.kr/stats.html?port=${port}`)}`;
  try{
    const res=await fetch(proxy,{cache:'no-store'});
    if(!res.ok) return null;
    const d=await res.json();
    return d.contents?parseStatsHtml(d.contents):null;
  }catch(e){console.debug('[NP] proxy 실패:',e.message);return null}
}

async function fetchAlbumArt(artist,title){
  try{
    const q=encodeURIComponent((artist?`${artist} `:'')+title);
    const res=await fetch(
      `https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=3`,
      {cache:'default'});
    if(!res.ok) return null;
    const d=await res.json();
    if(!d.results?.length) return null;
    return d.results[0].artworkUrl100.replace('100x100bb','600x600bb');
  }catch(e){return null}
}

function updateNowPlayingUI(artist,title,artUrl,loading=false){
  const albumEl=document.getElementById('nowPlayingAlbum');
  if(loading){
    albumEl.innerHTML='<div class="album-placeholder"><span class="np-spin">⟳</span></div>';
    albumEl.classList.remove('has-art');
    setMarqueeText('titleMarquee','titleInner','npTitle','불러오는 중...');
    setMarqueeText('artistMarquee','artistInner','npArtist','');
    return;
  }

  setMarqueeText('titleMarquee','titleInner','npTitle',title||'–');
  setMarqueeText('artistMarquee','artistInner','npArtist',artist||'');

  if(artUrl!==undefined){
    if(artUrl){
      const img=new Image();
      img.alt=title;
      img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
      img.onload=()=>{
        albumEl.innerHTML='';albumEl.appendChild(img);
        albumEl.classList.add('has-art');
        setImmersiveBg(artUrl);
      };
      img.onerror=()=>{
        albumEl.innerHTML='<div class="album-placeholder">🎵</div>';
        albumEl.classList.remove('has-art');
        setImmersiveBg(null);
      };
      img.src=artUrl;
      currentArtUrl=artUrl;
    }else{
      albumEl.innerHTML='<div class="album-placeholder">🎵</div>';
      albumEl.classList.remove('has-art');
      setImmersiveBg(null);
      currentArtUrl=null;
    }
  }
}

async function pollNowPlaying(){
  if(!activeId) return;
  const port=getPort(activeId);
  let meta=await fetchStatsMeta(port);
  if(!meta) meta=await fetchStatsMetaViaProxy(port);
  if(!meta) return;

  const trackStr=`${meta.artist}||${meta.title}`;
  if(trackStr===lastTrackStr) return;
  lastTrackStr=trackStr;

  updateNowPlayingUI(meta.artist,meta.title,undefined);
  const art=await fetchAlbumArt(meta.artist,meta.title);
  if(lastTrackStr===`${meta.artist}||${meta.title}`){
    updateNowPlayingUI(meta.artist,meta.title,art||null);
  }
}

function startNowPlaying(){
  lastTrackStr='';currentArtUrl=null;
  if(npTimer) clearInterval(npTimer);
  updateNowPlayingUI('','','',true);
  pollNowPlaying();
  npTimer=setInterval(pollNowPlaying,12000);
}

function stopNowPlaying(){
  if(npTimer){clearInterval(npTimer);npTimer=null}
  setMarqueeText('titleMarquee','titleInner','npTitle','–');
  setMarqueeText('artistMarquee','artistInner','npArtist','');
  document.getElementById('nowPlayingAlbum').innerHTML='<div class="album-placeholder">🎵</div>';
  document.getElementById('nowPlayingAlbum').classList.remove('has-art');
  setImmersiveBg(null);
  lastTrackStr='';currentArtUrl=null;
}
